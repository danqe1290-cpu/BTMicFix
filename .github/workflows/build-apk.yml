name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build_tmp/outputs/apk/debug/app-debug.apk "out/BTMicFix-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BTMicFix-apk
          path: out/*.apk

      # A release gives a plain download link that opens straight on a phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "BTMicFix build ${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }}" \
            --target "${{ github.sha }}"
